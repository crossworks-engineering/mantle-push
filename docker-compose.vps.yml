# Overlay for the DEDICATED Mantle Push VPS (push.crossworks.network).
#
#   docker compose -f docker-compose.yml -f docker-compose.vps.yml up -d --build
#
# Unlike the old co-located deploy (docker-compose.prod.yml, which joined
# Mantle's network and borrowed Mantle's Caddy), this box is standalone: it runs
# its OWN Caddy to terminate TLS for push.crossworks.network and proxy to the
# relay. Nothing here is published to the host except Caddy's 80/443.
#
# Values come from a gitignored `.env` next to this file on the box (compose
# auto-loads it). To go live: drop AuthKey.p8 + fcm-service-account.json in
# ./secrets/, set PUSH_PROVIDER=live in .env, then run the up command above.

services:
  push:
    restart: unless-stopped
    ports: !override [] # internal only — Caddy reaches it as push:8787
    environment:
      PORT: 8787
      DATABASE_URL: postgres://push:push@db:5432/mantle_push
      PUSH_PROVIDER: ${PUSH_PROVIDER:-mock}
      # APNs (Apple) — bundle id + token-auth identifiers (not secret; the .p8 is).
      APNS_TOPIC: ${APNS_TOPIC:-crossworks.engineering.mantle}
      APNS_KEY_ID: ${APNS_KEY_ID:-}
      APNS_TEAM_ID: ${APNS_TEAM_ID:-}
      APNS_KEY_PATH: /run/secrets/apns.p8
      APNS_ENV: ${APNS_ENV:-sandbox}
      # FCM (Google) — project id + service-account JSON (the JSON is the secret).
      FCM_PROJECT_ID: ${FCM_PROJECT_ID:-}
      FCM_SERVICE_ACCOUNT_PATH: /run/secrets/fcm-service-account.json
    volumes:
      - ./secrets/AuthKey.p8:/run/secrets/apns.p8:ro
      - ./secrets/fcm-service-account.json:/run/secrets/fcm-service-account.json:ro

  db:
    restart: unless-stopped
    ports: !override [] # don't expose Postgres on the host

  caddy:
    image: caddy:2-alpine
    container_name: mantle_push_caddy
    restart: unless-stopped
    depends_on:
      - push
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
